syntax = "proto3";

package proto;

service GameNode {

rpc Chat (ChatMessage) returns (ActionResponse);
rpc Attack (AttackRequest) returns (ActionResponse);
rpc Move (MoveRequest) returns (ActionResponse);
rpc FindPlayer (FindPlayerRequest) returns (FindPlayerResponse);
rpc StorePlayer (StorePlayerRequest) returns (ActionResponse);

}
message ChatMessage {
    string sender_id = 1;
    string text = 2;
}

message AttackRequest {
    string attacker_id = 1;
    string weapon = 2;
    int32 damage = 3;
}

message MoveRequest {
    string player_id = 1;
    string direction = 2;
}

message ActionResponse {
    bool success = 1;
    string status_message = 2;
}

message FindPlayerRequest {
    string target_player_id = 1;
}

message FindPlayerResponse {
    bool found = 1;
    string ip = 2;
    int32 port = 3;

    repeated NodeContact closest_nodes = 4;
}

message StorePlayerRequest {
    string player_id = 1;
    string ip = 2;
    int32 port = 3;
}

message NodeContact {
    string node_id = 1;
    string ip = 2;
    int32 port = 3;
}